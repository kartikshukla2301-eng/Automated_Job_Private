<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Senior Distributed Systems Engineer at ScaleOps - LinkedIn Easy Apply</title>
</head>
<body>
  <div class="jobs-easy-apply-modal" role="dialog" aria-labelledby="easy-apply-title">
    <div class="modal-header">
      <h2 id="easy-apply-title">Apply to ScaleOps</h2>
      <h3 class="job-title">Senior Distributed Systems Engineer</h3>
      <div class="company-name">ScaleOps Technologies</div>
      <div class="job-location">Bangalore, Karnataka, India (Remote)</div>
    </div>

    <form id="linkedin-easy-apply-form" action="/jobs/apply" method="POST">
      <!-- Contact Info Section -->
      <div class="jobs-easy-apply-form-section">
        <div class="form-group">
          <label for="li_first_name">First name <span class="required">*</span></label>
          <input type="text" id="li_first_name" name="firstName" required autocomplete="given-name">
        </div>

        <div class="form-group">
          <label for="li_last_name">Last name <span class="required">*</span></label>
          <input type="text" id="li_last_name" name="lastName" required autocomplete="family-name">
        </div>

        <div class="form-group">
          <label for="li_email">Email address <span class="required">*</span></label>
          <input type="email" id="li_email" name="emailAddress" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="li_phone">Phone number <span class="required">*</span></label>
          <input type="tel" id="li_phone" name="phoneNumber" required autocomplete="tel">
        </div>
      </div>

      <!-- Additional Questions Section -->
      <div class="jobs-easy-apply-form-section">
        <div class="form-group">
          <label for="li_notice">What is your notice period in days? <span class="required">*</span></label>
          <input type="text" id="li_notice" name="noticePeriodDays" required>
        </div>

        <div class="form-group">
          <label for="li_exp">How many years of work experience do you have with Python?</label>
          <input type="number" id="li_exp" name="experiencePython" min="0">
        </div>

        <!-- File upload must be skipped by L0 / policy -->
        <div class="form-group">
          <label for="li_resume">Resume</label>
          <input type="file" id="li_resume" name="resumeFile">
        </div>
      </div>

      <div class="modal-footer">
        <button type="submit" id="li-submit-application" class="artdeco-button--primary">
          Submit application
        </button>
      </div>
    </form>
  </div>
</body>
</html>
