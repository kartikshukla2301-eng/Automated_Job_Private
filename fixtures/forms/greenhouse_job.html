<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Backend Engineer at Example Software - Application</title>
</head>
<body>
  <div id="app-container">
    <div id="header">
      <h1 class="job-title">Backend Engineer</h1>
      <span class="company-name">Example Software</span>
    </div>

    <form id="application_form" action="/apply" method="POST">
      <!-- Standard Identity Fields -->
      <div class="field">
        <label for="first_name">First Name <span class="required">*</span></label>
        <input type="text" id="first_name" name="first_name" required autocomplete="given-name">
      </div>

      <div class="field">
        <label for="last_name">Last Name <span class="required">*</span></label>
        <input type="text" id="last_name" name="last_name" required autocomplete="family-name">
      </div>

      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="phone">Phone <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel">
      </div>

      <!-- Links & Online Profiles -->
      <div class="field">
        <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
        <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]">
      </div>

      <div class="field">
        <label for="job_application_answers_attributes_1_text_value">Website / Portfolio</label>
        <input type="text" id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]">
      </div>

      <!-- Custom Questions that cannot be answered from verified profile alone -->
      <div class="field">
        <label for="job_application_answers_attributes_2_text_value">What is your current notice period in days? <span class="required">*</span></label>
        <input type="text" id="job_application_answers_attributes_2_text_value" name="job_application[answers_attributes][2][text_value]">
      </div>

      <div class="field">
        <label for="job_application_answers_attributes_3_text_value">Why are you interested in joining Example Software?</label>
        <textarea id="job_application_answers_attributes_3_text_value" name="job_application[answers_attributes][3][text_value]"></textarea>
      </div>

      <!-- Sensitive Fields (must be skipped: no resume upload, no credentials, no OTP) -->
      <div class="field">
        <label for="resume">Resume / CV</label>
        <input type="file" id="resume" name="resume">
      </div>

      <div class="field">
        <label for="account_password">Create Password</label>
        <input type="password" id="account_password" name="password">
      </div>

      <div class="field">
        <label for="otp_verification">Enter One-Time Password (OTP)</label>
        <input type="text" id="otp_verification" name="otp_code">
      </div>

      <div class="form-actions">
        <button type="submit" id="submit_app" class="btn-submit">Submit Application</button>
      </div>
    </form>
  </div>
</body>
</html>
